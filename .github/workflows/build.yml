# EasyConnect quraşdırıcıları: macOS (Apple Silicon + Intel) DMG və Windows (NSIS + MSI).
# İşə salmaq: GitHub → Actions → "Build installers" → Run workflow
# və ya versiya teqi göndərməklə: git tag v0.4.0 && git push --tags
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies (Tauri CLI)
        run: npm ci

      - name: Fetch scrcpy for macOS
        run: bash scripts/fetch-scrcpy-macos.sh ${{ matrix.arch }}

      # Tətbiq ad-hoc imzalanır (tauri.macos.conf.json → signingIdentity "-"): işləyir, amma
      # internetdən yüklənəndə ilk açılışda Gatekeeper icazə istəyir. Apple Developer ID imzası və
      # notarization üçün bax: docs/RELEASE.md → "macOS".
      - name: Build
        run: npx tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: EasyConnect-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: EasyConnect-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
